<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a4eed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Rounded Background -->
  <rect width="452" height="452" x="30" y="30" rx="120" fill="url(#bgGrad)" />

  <!-- Bold White Letter G -->
  <!-- Outer arc, inner arc, and horizontal bar with rounded ends -->
  <path d="M 345 178 A 122 122 0 1 0 366 312 L 272 312 A 22 22 0 0 1 272 268 L 366 268 A 22 22 0 0 1 388 290 A 166 166 0 1 1 378 148 A 22 22 0 0 1 345 178 Z" fill="#ffffff" />

  <!-- 4-Point Golden Sparkle / Star (Top Right) -->
  <path d="M 416 60 Q 416 112 468 112 Q 416 112 416 164 Q 416 112 364 112 Q 416 112 416 60 Z" fill="url(#starGrad)" filter="url(#starGlow)" />
</svg>
