databases:
  - name: ginie-db
    databaseName: ginie
    user: ginie_user
    plan: free

services:
  - type: web
    name: ginie-api
    env: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @ginie/common run build && pnpm --filter @ginie/i18n run build && pnpm --filter @ginie/database run generate && pnpm --filter @ginie/database run build && pnpm --filter @ginie/api run build
    startCommand: npx prisma db push --schema=packages/database/prisma/schema.prisma && pnpm --filter @ginie/database run seed && pnpm --filter @ginie/api run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ginie-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@ginie.space
      - key: ADMIN_PASSWORD
        generateValue: true

  - type: worker
    name: ginie-worker
    env: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @ginie/worker run build
    startCommand: pnpm --filter @ginie/worker run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ginie-db
          property: connectionString

  - type: web
    name: ginie-whatsapp-bridge
    env: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @ginie/whatsapp-bridge run build
    startCommand: pnpm --filter @ginie/whatsapp-bridge run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_BRIDGE_SECRET
        generateValue: true

  - type: web
    name: ginie-web
    env: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @ginie/common run build && pnpm --filter @ginie/i18n run build && pnpm --filter @ginie/web run build
    startCommand: pnpm --filter @ginie/web run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        fromService:
          type: web
          name: ginie-api
          property: host
