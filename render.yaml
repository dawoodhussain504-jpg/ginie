services:
  - type: web
    name: ginie-api
    env: node
    plan: starter
    buildCommand: pnpm install && pnpm --filter @ginie/api run build
    startCommand: pnpm --filter @ginie/api run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

  - type: worker
    name: ginie-worker
    env: node
    plan: starter
    buildCommand: pnpm install && pnpm --filter @ginie/worker run build
    startCommand: pnpm --filter @ginie/worker run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

  - type: web
    name: ginie-whatsapp-bridge
    env: node
    plan: starter
    buildCommand: pnpm install && pnpm --filter @ginie/whatsapp-bridge run build
    startCommand: pnpm --filter @ginie/whatsapp-bridge run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_BRIDGE_SECRET
        generateValue: true

  - type: web
    name: ginie-web
    env: node
    plan: starter
    buildCommand: pnpm install && pnpm --filter @ginie/web run build
    startCommand: pnpm --filter @ginie/web run start
    envVars:
      - key: NODE_ENV
        value: production
