version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - '3000'
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
      - WHATSAPP_BRIDGE_URL=http://whatsapp-bridge:3001
      - WHATSAPP_BRIDGE_SECRET=${WHATSAPP_BRIDGE_SECRET}
    expose:
      - '4000'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4000/api/health']
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
    depends_on:
      - api
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  whatsapp-bridge:
    build:
      context: apps/whatsapp-bridge
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - BRIDGE_PORT=3001
      - WHATSAPP_BRIDGE_SECRET=${WHATSAPP_BRIDGE_SECRET}
      - API_WEBHOOK_URL=http://api:4000/api/whatsapp/webhook/bridge
    expose:
      - '3001'
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

volumes:
  caddy_data:
  caddy_config:
